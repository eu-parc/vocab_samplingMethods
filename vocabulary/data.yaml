# ===========================================================================
# SAMPLING METHODS VOCABULARY — DRAFT
# ===========================================================================
# Status: draft, not yet approved, not yet SKOSified (no identifiers minted
# — see README.md, "Two separate steps: preparing vs. minting identifiers").
# Flat list by design — no broader/narrower hierarchy between methods.
# ===========================================================================

id: https://w3id.org/chemical-exposome/vocabulary/sampling-methods
name: sampling-methods-vocabulary
title: Sampling Methods Vocabulary
description: >-
  Controlled vocabulary of sample collection methods used in environmental
  monitoring, developed within the PARC project (Partnership for the
  Assessment of Risks from Chemicals). Covers active and passive air
  sampling, atmospheric deposition collectors, point (grab) sampling of
  water, sediment and soil, plant material sampling, and depth-profile
  sampling. Scope is currently limited to the outdoor (ambient) environment
  — indoor matrices (indoor air, indoor dust) and biota (e.g. fish,
  mussels) are not yet covered and may be added in a future version.
version: "0.1.0"
license: https://creativecommons.org/licenses/by/4.0/
created_by: https://orcid.org/0000-0002-6063-0958
created_on: "2026-09-03T00:00:00Z"
last_updated_on: "2026-09-07T00:00:00Z"
modified_by: https://orcid.org/0000-0002-6063-0958

comments:
  - >-
    Editorial convention: the target substance group (e.g. "hydrophobic
    organic contaminants") is stated in a method's description only when
    the sampling mechanism itself is chemically selective — i.e. active or
    passive samplers relying on a sorbent or membrane medium, where the
    sorption/diffusion process determines what gets captured. General
    matrix-collection methods (Grab, Grab + Filtration, Bulk collector,
    Wet-only collector, Field sampling, Profile sampling) collect the whole
    matrix without chemical selection — which substances are measured is
    decided by the subsequent laboratory analysis, not by the sampling
    method itself — so no target substance group is stated for those.
  - >-
    Kept as a flat list by editorial decision (2026-09) — some methods read
    like natural variants of others (e.g. Grab + Filtration vs. Grab;
    Passive SIP vs. Passive PUF), but no broader/narrower hierarchy is
    modelled for now, to keep the vocabulary simple.
  - >-
    Editorial convention: every method's description states the sample
    matrix or matrices it applies to (air, water, sediment, soil, plant
    material, atmospheric deposition...) — either directly (e.g. "Active
    air sampling...") or explicitly where it's narrower than a related
    method (e.g. Grab + Filtration applies to water and sediment, not soil).
  - >-
    Editorial decision (2026-09): continuous, automated ambient particulate
    monitors (e.g. ISO 11057-type instruments — beta-attenuation, optical,
    or similar) are deliberately NOT included as a sampling method here, for
    two independent reasons. First, they don't retain a physical sample for
    subsequent laboratory analysis, which this vocabulary assumes (see the
    SamplingMethod description above). Second, they report a bulk
    particulate mass/count rather than the concentration of a specific
    substance in a specific matrix, which doesn't fit the substance x
    matrix concentration data model used downstream — so even a reworked
    description wouldn't make the resulting data usable there. Revisit
    only if that downstream data model changes.
  - >-
    Scope note (2026-09), following a review against PARC deliverable
    D9.4-1 (Annex-1, Inventory Report Sampling): this vocabulary currently
    covers outdoor/ambient environmental sampling only, reflecting that
    work has so far focused on this domain. Two matrices that D9.4-1
    documents in detail are deliberately not yet covered: indoor
    environments (indoor air, indoor dust — ISO 16000 series) and biota
    (fish, mussels, seabird eggs — OSPAR/HELCOM/WFD guidance). This is a
    scope decision, not a correction — flagged here so it isn't lost. The
    vocabulary is expected to be extended as work progresses to further
    domains, in line with the project's broader harmonization work, not
    tied to any particular repository decision.

annotations:
  schema_status:
    tag: schema_status
    value: draft

prefixes:
  linkml: https://w3id.org/linkml/
  cenvo: https://w3id.org/chemical-exposome/terms/
  skos: http://www.w3.org/2004/02/skos/core#

default_prefix: cenvo

imports:
  - linkml:types

enums:

  SamplingMethod:
    description: >-
      Methods used to collect environmental samples (air, water, sediment,
      soil, plant material, atmospheric deposition) prior to laboratory
      analysis. Covers outdoor (ambient) environmental sampling only; indoor
      matrices and biota are out of scope for now (see comments above).

    permissible_values:

      # -----------------------------------------------------------------
      # AIR — ACTIVE
      # -----------------------------------------------------------------

      ActiveHiVol:
        aliases:
          - Active - HiVol
        description: >-
          Active air sampling using a high-volume sampler. Air is
          continuously drawn by a pump through a filter and, where
          applicable, a sorbent medium, on which the target substances are
          captured. The method uses high air flow rates, typically 200 to
          700 L/min (≈ 12 to 42 m³/h), allowing a large volume of air to be
          processed during the sampling interval and enabling determination
          of very low analyte concentrations. It is used mainly for
          monitoring persistent organic pollutants (POPs), PAHs,
          pesticides, and other trace contaminants in ambient air.

      ActiveLowVol:
        aliases:
          - Active - LowVol
        description: >-
          Active air sampling using a low-volume sampler. Air is
          continuously drawn by a pump through a filter or sorbent medium,
          on which the target substances are captured. The method uses
          lower air flow rates, typically 1 to 40 L/min for sorbent-based
          sampling, or approximately 1 to 3 m³/h (≈ 16 to 50 L/min) for
          standard PM₁₀ and PM₂.₅ monitoring samplers. The method is
          suitable for routine long-term air quality monitoring and
          exposure studies.

      # -----------------------------------------------------------------
      # AIR — PASSIVE
      # -----------------------------------------------------------------

      PassivePUF:
        aliases:
          - Passive PUF
        description: >-
          Passive air sampling without the use of a pump. Target substances
          are captured on a polyurethane foam (PUF) sorbent medium.

      PassiveSIP:
        aliases:
          - Passive SIP
        description: >-
          Passive air sampling without the use of a pump. Target substances
          are captured on a sorbent medium consisting of impregnated
          polyurethane foam (SIP).

      PassiveXAD:
        aliases:
          - Passive XAD
        description: >-
          Passive air sampling without the use of a pump. Target substances
          are captured on an XAD sorbent resin medium.

      # -----------------------------------------------------------------
      # ATMOSPHERIC DEPOSITION
      # -----------------------------------------------------------------

      BulkCollector:
        aliases:
          - Bulk collector
        description: >-
          Precipitation and dry deposition are collected together in a
          permanently open collection device. The method provides data on
          total (wet and dry) atmospheric deposition of the target
          substances.

      WetOnlyCollector:
        aliases:
          - Wet-only collector
        description: >-
          The collection device is automatically opened only during
          precipitation events, so only precipitation and wet deposition
          are collected. Dry deposition between precipitation episodes is
          not sampled.

      # -----------------------------------------------------------------
      # WATER / SEDIMENT / SOIL — GRAB
      # -----------------------------------------------------------------

      Grab:
        description: >-
          Point (grab) sampling of water, sediment, or soil. The sample is
          taken once, from a specific location and time, without combining
          it with other sub-samples. It represents the condition of the
          given matrix at the moment of sampling.

      GrabFiltration:
        aliases:
          - Grab + Filtration
        description: >-
          Point (grab) sampling of water or sediment, followed by
          filtration. After collection, the sample is filtered to separate
          the dissolved and solid (particulate) phases for subsequent
          analysis.

      ProfileSampling:
        aliases:
          - Profile sampling
        description: >-
          Depth-profile sampling of soil or sediment. Samples are taken
          from defined layers or depths and represent the vertical
          distribution of the target substances within the matrix.

      # -----------------------------------------------------------------
      # WATER — PASSIVE
      # -----------------------------------------------------------------

      PassivePOCIS:
        aliases:
          - Passive POCIS
        description: >-
          Passive water sampling using a POCIS (Polar Organic Chemical
          Integrative Sampler). Target substances are continuously
          accumulated from the aquatic environment onto a sorbent medium
          enclosed between semipermeable membranes, without the use of a
          pump. The method is intended mainly for monitoring polar organic
          contaminants.

      PassiveSilicone:
        aliases:
          - Passive SILICONE
        description: >-
          Passive water sampling using a silicone sampler. Target
          substances diffuse from the aquatic environment into the
          silicone sorbent medium without the use of a pump. The method is
          suitable mainly for nonpolar and hydrophobic organic
          contaminants.

      PassiveSPMD:
        aliases:
          - Passive SPMD
        description: >-
          Passive water sampling using a semipermeable membrane device
          (SPMD). Target substances diffuse from the aquatic environment
          through a semipermeable membrane into the accumulation medium,
          without the use of a pump. The method is intended mainly for
          long-term monitoring of hydrophobic organic contaminants.

      PassiveDGT:
        aliases:
          - Passive DGT
        description: >-
          Passive sampling of water, sediment, or soil using DGT (Diffusive
          Gradients in Thin-films). Target substances diffuse through a
          hydrogel layer and are accumulated on a binding resin, without the
          use of a pump. The method is used mainly for trace metals and
          other inorganic/ionic contaminants; binding gels adapted for other
          substance groups also exist.

      # -----------------------------------------------------------------
      # PLANT MATERIAL
      # -----------------------------------------------------------------

      FieldSampling:
        aliases:
          - Field sampling
        description: >-
          Field collection of plant material. A sample of a plant, or part
          of a plant, is collected at a defined location and time and
          represents the state of the plant matrix at the moment of
          sampling.
